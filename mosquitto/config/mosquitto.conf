# Eclipse Mosquitto Configuration for IndustrialTwin

# Plain MQTT Listener
listener 1883
allow_anonymous true

# WebSockets Listener (for browser clients if needed)
listener 9001
protocol websockets
allow_anonymous true

# Logging settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence settings
persistence true
persistence_location /mosquitto/data/
