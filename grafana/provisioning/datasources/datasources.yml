apiVersion: 1

datasources:
  - name: IndustrialTwin API
    type: yesoreyeram-infinity-datasource
    uid: industrial_twin_api
    access: proxy
    isDefault: true
    jsonData:
      global_queries: []

  - name: IndustrialTwin MongoDB
    type: grafana-mongodb-datasource
    uid: industrial_twin_mongo
    access: proxy
    isDefault: false
    jsonData:
      mongodb_url: mongodb://mongodb:27017
      db_name: industrial_twin
    editable: true
